<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/settings.css"><title>微信伙伴</title></head>
<body>
<p>每个微信 Bot 固定对应一个伙伴。支持文字、图片收发和微信语音转文字；登录安全保存，重启后自动恢复。</p>
<div id="notice" role="status" aria-live="polite">正在读取配置…</div>
<form id="binding-form">
<input id="binding-id" type="hidden">
<label>Bot 名称<input id="binding-name" maxlength="60" required placeholder="例如：家人的个人助理"></label>
<label>绑定伙伴<select id="companion" required></select></label>
<label class="inline"><input id="enabled" type="checkbox">启用这组收发</label>
<div class="actions"><button type="submit">保存绑定</button><button type="button" id="reset-form">清空表单</button><button type="button" id="refresh">刷新状态</button><button type="button" id="retry-save">重试保存登录</button></div>
</form>
<div id="bots"></div>
<section id="login" hidden><p id="login-status"></p><img id="qr" alt="微信 Bot 登录二维码"><button type="button" id="cancel-login">取消本次登录</button></section>
<script src="/settings.js"></script></body></html>
